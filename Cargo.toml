[package]
name = "rust_rbac"
version = "1.1.0"
edition = "2021"
description = "RustRbac is online RBAC and centralized configuration for the terminal and a local web page."
license = "MIT"
authors = ["Wong Chun Fai <cloudgen.wong@gmail.com>"]
readme = "README.md"

[[bin]]
name = "rust-rbac"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
getrandom = "0.2"
libc = "0.2"
mysql = "25"
pbkdf2 = { version = "0.12", features = ["hmac"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
unicode-width = "0.2"
