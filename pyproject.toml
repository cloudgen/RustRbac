[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyRbac"
version = "1.0.2"
description = "PyRbac is online RBAC and centralized configuration for the terminal and a local web page."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Wong Chun Fai", email = "cloudgen.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "RBAC", "configuration"]

dependencies = [
    "ChronicleLogger>=1.3.1",
    "PyMySQL>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/cloudgen/PyRbac"
Repository = "https://github.com/cloudgen/PyRbac"
Issues = "https://github.com/cloudgen/PyRbac/issues"

[project.scripts]
py-rbac = "PyRbac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
